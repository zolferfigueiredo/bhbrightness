name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04 # macOS runners bill 10x on this private repo
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck build.sh release.sh run.sh .githooks/pre-commit
      - run: swift test
